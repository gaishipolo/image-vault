# ImageVault 开发环境 Docker Compose 配置
# 使用方法: docker-compose up -d

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: imagevault-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: image_vault
      MYSQL_USER: imagevault
      MYSQL_PASSWORD: imagevaultpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/init_database.sql:/docker-entrypoint-initdb.d/init.sql
    command: --max_allowed_packet=64M --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Flask 后端
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: imagevault-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://imagevault:imagevaultpassword@mysql:3306/image_vault
      - SECRET_KEY=dev-secret-key-change-in-production
      - JWT_SECRET_KEY=dev-jwt-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./server:/app
    command: flask run --host=0.0.0.0 --debug

  # React 前端（开发模式）
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: imagevault-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./client:/app
      - /app/node_modules
    command: npm run dev -- --host

volumes:
  mysql-data:
    driver: local
